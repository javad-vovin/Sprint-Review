name: Build & Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-send:
    name: Build APK & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 secret is missing, using debug signing."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build APK
        id: build_apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ -n "${STORE_PASSWORD}" ]; then
            echo "Building Release APK..."
            gradle assembleRelease --stacktrace
          else
            echo "Building Debug APK..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/*/*/*.apk

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set in Repository Secrets."
            echo "Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to your GitHub repo secrets to receive built APKs automatically."
          else
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              FILE_NAME=$(basename "$APK_FILE")
              COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
              SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
              
              echo "Sending $FILE_NAME to Telegram..."
              
              curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                   -F document=@"${APK_FILE}" \
                   -F caption="📦 *Sprint Review App APK*%0A%0A🚀 *Build Status:* Successful%0A📱 *File:* \`${FILE_NAME}\`%0A🌿 *Branch:* \`${GITHUB_REF_NAME}\`%0A🔖 *Commit:* \`${SHORT_SHA}\` - ${COMMIT_MSG}" \
                   -F parse_mode="Markdown" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
              
              echo "APK successfully sent to Telegram!"
            else
              echo "Error: No APK file was found to send."
              exit 1
            fi
          fi

